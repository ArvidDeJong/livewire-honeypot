title: Livewire Honeypot
description: Laravel package that stops form spam in Livewire 3 and 4 components and plain Blade forms with a hidden honeypot field and a time check, without a CAPTCHA.
url: https://arviddejong.github.io
baseurl: /livewire-honeypot

remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-sitemap

# Facts about the package, used by the structured data and llms.txt.
package:
  name: darvis/livewire-honeypot
  repository: https://github.com/ArvidDeJong/livewire-honeypot
  packagist: https://packagist.org/packages/darvis/livewire-honeypot
  license_url: https://github.com/ArvidDeJong/livewire-honeypot/blob/main/LICENSE
  requires: PHP 8.2+, Laravel 11, 12 or 13, Livewire 3 or 4
  platforms: [Laravel, Livewire]
  keywords: [laravel honeypot, livewire honeypot, form spam protection, contact form spam, time trap, captcha alternative, livewire 4, laravel 13]

# Developer credit in the footer and the structured data.
developer:
  company: ARVID.NL
  url: https://arvid.nl

color_scheme: light
search_enabled: true
heading_anchors: true

aux_links:
  GitHub: https://github.com/ArvidDeJong/livewire-honeypot
  Packagist: https://packagist.org/packages/darvis/livewire-honeypot
aux_links_new_tab: true

gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/ArvidDeJong/livewire-honeypot
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: tree

defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/social-preview.png

